name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: 🚀 Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            --package="semantic-release@26.0.1" \
            --package="@semantic-release/changelog@7.0.0" \
            --package="@semantic-release/git@11.0.1" \
            semantic-release
